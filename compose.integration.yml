name: mindqa-db-commons-node-test
services:
  postgresql:
    image: postgres:17
    environment:
      POSTGRES_USER: mindqa
      POSTGRES_PASSWORD: Mindqa_Test_123!
      POSTGRES_DB: mindqa
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindqa -d mindqa']
      interval: 5s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Mindqa_Test_123!
      MYSQL_DATABASE: mindqa
    ports: ['127.0.0.1:53306:3306']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Mindqa_Test_123!
    ports: ['127.0.0.1:51433:1433']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      SQLCMDPASSWORD: Mindqa_Test_123!
    entrypoint:
      [
        '/opt/mssql-tools18/bin/sqlcmd',
        '-S',
        'sqlserver',
        '-U',
        'sa',
        '-C',
        '-b',
        '-Q',
        "IF DB_ID('mindqa') IS NULL CREATE DATABASE mindqa",
      ]
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Mindqa_Test_123!
      APP_USER: mindqa
      APP_USER_PASSWORD: Mindqa_Test_123!
    ports: ['127.0.0.1:51521:1521']
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 60
